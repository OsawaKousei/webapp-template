volumes:
  frontend-node-modules:
  api-node-modules:

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    user: "node"
    volumes:
      - ./frontend/app:/home/node/app
      - ./shared:/home/node/app/shared
      - frontend-node-modules:/home/node/app/node_modules
    ports:
      - "5173:5173"

  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app
    command: ["sh", "-c", "sleep infinity"]
    tty: true
    stdin_open: true
    volumes:
      - ./frontend/app:/app
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      - frontend

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile.dev
    user: "node"
    volumes:
      - ./backend/api/app:/home/node/app
      - ./shared:/home/node/app/shared
      - api-node-modules:/home/node/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

networks:
  default:
    name: myapp-network